# Project configuration
name: 'my_new_project'
version: '1.0.0'
config-version: 2

profile: 'default'

# File paths
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

# Model configuration
models:
  my_new_project:

    silver:
      +materialized: table
      +schema: silver

    gold:
      +materialized: table
      +schema: gold

    example:
      +materialized: table